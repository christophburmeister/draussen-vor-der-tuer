<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lightgallery.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lg-thumbnail.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lg-zoom.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <img src="header.jpg" alt="" class="header-bg" />
    <h1>{{TITLE}}</h1>
  </header>

  <main>
    <div id="gallery">
      {{GALLERY_ITEMS}}
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/lightgallery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/thumbnail/lg-thumbnail.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/plugins/zoom/lg-zoom.min.js"></script>
  <script>
    document.querySelectorAll('#gallery a[data-lg-size]').forEach(a => {
      const [w, h] = a.dataset.lgSize.split('-').map(Number);
      if (w && h) a.style.flexGrow = (w / h).toFixed(4);
    });
  </script>
  <script>
    const gallery = document.getElementById('gallery');

    lightGallery(gallery, {
        mobileSettings: {
        controls: true,
        showCloseIcon: true,
        download: false
      },
      plugins: [lgThumbnail, lgZoom],
      speed: 400,
      thumbnail: true,
      zoom: true,
      download: false,
      getCaptionFromTitleOrAlt: false,
    });
  </script>
</body>
</html>
